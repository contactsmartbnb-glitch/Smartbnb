<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeMicroNut — Espace pharmacien</title>
<style>
:root{--bg:#28384A;--card:#fff;--line:#E2EAE4;--fg:#15211C;--mut:#6a7a86;--grn:#0B6E4F;--grn2:#12936A;--amb:#B5873C;--red:#B5543C}
*{box-sizing:border-box}
body{margin:0;font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2f6;color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:var(--grn)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--grn);color:#fff;transition:background .15s}
.btn:hover{background:var(--grn2)}
.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:#f4f7f5}
.btn:disabled{opacity:.5;cursor:default}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--bg);color:#fff}
.topbar b{font-size:1.05rem;letter-spacing:.01em}
.topbar .sp{flex:1}
.topbar .who{font-size:.85rem;opacity:.85}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(14px,env(safe-area-inset-left)) 60px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#35495F,#1F2B39);padding:20px}
.login .box{background:#fff;border-radius:18px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.login h1{margin:0 0 4px;font-size:1.3rem}
.login p{margin:0 0 20px;color:var(--mut);font-size:.9rem}
.login label{display:block;font-size:.8rem;font-weight:700;margin-bottom:12px}
.login input{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid #CBD8CF;border-radius:10px;font:inherit;font-size:1rem}
.login input:focus{outline:2px solid var(--grn);outline-offset:1px;border-color:var(--grn)}
.login .btn{width:100%;margin-top:4px}
.login .err{color:var(--red);font-size:.85rem;margin:12px 0 0;min-height:1em}

/* layout */
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:600;color:var(--mut)}
.chip.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.list{display:flex;flex-direction:column;gap:9px;max-height:72vh;overflow:auto}
.item{text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .12s,box-shadow .12s}
.item:hover{border-color:#bcd3c4}
.item.sel{border-color:var(--grn);box-shadow:0 0 0 2px rgba(11,110,79,.15)}
.item .r1{display:flex;align-items:center;gap:8px}
.item .em{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r2{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:.78rem;color:var(--mut)}
.badge{font-size:.68rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.en_attente{background:#FBF0D8;color:#8a6b1e}
.badge.valide{background:#E3F1E9;color:var(--grn)}
.badge.envoye{background:#DCEAF7;color:#2b5f8a}
.badge.bilan{background:#EEF2F5;color:#55707f}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;min-height:60vh}
.empty{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--mut);text-align:center;padding:30px}
.phead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .em{font-weight:800;font-size:1.05rem}
.phead .meta{flex:1;min-width:140px}
.phead .meta .d{font-size:.8rem;color:var(--mut);margin-top:2px}
.pbody{padding:18px 20px}
.sec-t{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
details.rep{margin:0 0 18px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.rep summary{padding:11px 14px;cursor:pointer;font-weight:700;font-size:.88rem;background:#f7faf8}
details.rep .rc{padding:12px 14px;font-size:.84rem;max-height:280px;overflow:auto}
.repline{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #eef1ef}
.repline:last-child{border:0}
.repline .k{font-weight:700;color:#41515c;min-width:120px;flex:none}
.repline .v{color:#2c3a42}
.edit-note{font-size:.82rem;color:var(--mut);margin:0 0 8px}
.editor{border:1px solid var(--line);border-radius:12px;padding:6px 6px;background:#fcfdfc}
.editor .rapedit{min-height:320px;max-height:60vh;overflow:auto;padding:16px 18px;background:#fff;border-radius:8px;outline:none}
.editor .rapedit:focus{box-shadow:0 0 0 2px rgba(11,110,79,.18)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.actions .sp{flex:1}
.savemsg{font-size:.85rem;color:var(--grn);min-height:1em}
.savemsg.err{color:var(--red)}

/* report look inside editor */
.rapedit .lmn-rap-head{border-bottom:2px solid #E3F1E9;padding-bottom:10px;margin-bottom:12px}
.rapedit h2{margin:2px 0;font-size:1.35rem;color:#15211C}
.rapedit h3{font-size:1.05rem;color:var(--grn);margin:14px 0 7px}
.rapedit .lmn-rap-k{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--grn2)}
.rapedit .lmn-rap-date{font-size:.82rem;color:#77857B}
.rapedit ul{margin:0 0 10px;padding-left:20px}
.rapedit li{margin-bottom:6px;color:#4A574F;line-height:1.5}
.rapedit .lmn-pistes{list-style:none;padding-left:0}
.rapedit .lmn-pistes li{background:#F1F7F3;border-radius:10px;padding:10px 13px;margin-bottom:7px;color:#15211C}
.rapedit .lmn-piste-d{background:#F7FAF8;border:1px solid #E2EAE4;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.rapedit .lmn-tag{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#E3F1E9;color:var(--grn);padding:2px 7px;border-radius:6px;margin-right:6px}
.rapedit .lmn-sub{font-weight:700;color:#15211C;margin:10px 0 4px}
.rapedit .lmn-dire{background:#F1F7F3;border-radius:10px;padding:12px 14px;font-style:italic}
.rapedit .lmn-rap-disc{font-size:.82rem;color:#6a5210;background:#FBF3DD;border-radius:10px;padding:9px 13px}
.rapedit p{line-height:1.55;color:#3a4a42}
.hide{display:none!important}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <form class="box" id="loginform">
    <h1>Espace pharmacien</h1>
    <p>LifeMicroNut — relecture &amp; validation des bilans</p>
    <label>E-mail<input type="email" id="li-mail" value="lifemicronut@gmail.com" autocomplete="username"></label>
    <label>Mot de passe<input type="password" id="li-pass" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="btn" type="submit" id="li-btn">Se connecter</button>
    <p class="err" id="li-err"></p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="topbar">
    <b>LifeMicroNut · Espace pharmacien</b>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="refresh" style="padding:8px 12px">Actualiser</button>
    <button class="btn ghost" id="logout" style="padding:8px 12px">Déconnexion</button>
  </div>
  <div class="wrap">
    <div class="filters" id="filters">
      <button class="chip on" data-f="en_attente">À relire</button>
      <button class="chip" data-f="valide">Validés</button>
      <button class="chip" data-f="envoye">Envoyés</button>
      <button class="chip" data-f="all">Tous</button>
    </div>
    <div class="grid">
      <div><div class="list" id="list"></div></div>
      <div class="panel" id="panel"><div class="empty" id="empty">Sélectionnez une demande à gauche pour la relire.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
  var SB_URL='https://ioetcwpsnvoavwpwnumi.supabase.co';
  var SB_KEY='sb_publishable_2cPPR1QkBvHEOKQChjKTcA_h-s9NW6h';
  var BILAN_LABEL={digestion:'Digestion',fatigue:'Fatigue'};
  var token=null, rows=[], current=null, filter='en_attente';
  function $(s,r){return (r||document).querySelector(s);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmtDate(s){try{var d=new Date(s);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch(e){return s;}}
  function hdr(auth){var h={'apikey':SB_KEY,'Content-Type':'application/json'};if(auth&&token)h['Authorization']='Bearer '+token;return h;}

  /* ---- LOGIN ---- */
  $('#loginform').addEventListener('submit',function(e){
    e.preventDefault();
    var mail=$('#li-mail').value.trim(), pass=$('#li-pass').value, err=$('#li-err'), btn=$('#li-btn');
    err.textContent=''; btn.disabled=true; btn.textContent='Connexion…';
    fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,password:pass})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        if(!res.ok||!res.j.access_token){ throw new Error(res.j.error_description||res.j.msg||'Identifiants incorrects'); }
        token=res.j.access_token;
        try{sessionStorage.setItem('lmn_bo_tok',token);sessionStorage.setItem('lmn_bo_mail',mail);}catch(e){}
        enterApp(mail);
      })
      .catch(function(e){ err.textContent=(''+e.message)||'Connexion impossible.'; btn.disabled=false; btn.textContent='Se connecter'; });
  });

  function enterApp(mail){
    $('#login').classList.add('hide'); $('#app').classList.remove('hide');
    $('#who').textContent=mail||''; load();
  }
  $('#logout').onclick=function(){ token=null; try{sessionStorage.removeItem('lmn_bo_tok');}catch(e){} $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#li-pass').value=''; };
  $('#refresh').onclick=function(){ load(); };
  [].forEach.call(document.querySelectorAll('#filters .chip'),function(c){ c.onclick=function(){ filter=c.getAttribute('data-f'); [].forEach.call(document.querySelectorAll('#filters .chip'),function(x){x.classList.toggle('on',x===c);}); renderList(); }; });

  /* ---- DATA ---- */
  function load(){
    var lst=$('#list'); lst.innerHTML='<p style="color:#6a7a86;font-size:.88rem;padding:8px">Chargement…</p>';
    fetch(SB_URL+'/rest/v1/demandes?select=*&order=created_at.desc',{headers:hdr(true)})
      .then(function(r){ if(r.status===401){throw new Error('session');} return r.json(); })
      .then(function(data){ rows=Array.isArray(data)?data:[]; renderList(); if(current){var u=rows.filter(function(x){return x.id===current.id;})[0]; if(u)openDemande(u);} })
      .catch(function(e){
        if((''+e.message)==='session'){ lst.innerHTML='<p style="color:#B5543C;font-size:.85rem;padding:8px">Session expirée. Reconnectez-vous.</p>'; return; }
        lst.innerHTML='<p style="color:#B5543C;font-size:.85rem;padding:8px">Lecture impossible. Avez-vous collé le script SQL des droits ?</p>';
      });
  }
  function renderList(){
    var lst=$('#list'); var f=rows.filter(function(r){return filter==='all'?true:r.statut===filter;});
    if(!f.length){ lst.innerHTML='<p style="color:#6a7a86;font-size:.88rem;padding:8px">Aucune demande ici.</p>'; return; }
    lst.innerHTML='';
    f.forEach(function(r){
      var b=document.createElement('button'); b.className='item'+(current&&current.id===r.id?' sel':''); b.type='button';
      b.innerHTML='<div class="r1"><span class="em">'+esc(r.email)+'</span></div>'+
        '<div class="r2"><span class="badge '+esc(r.statut)+'">'+statutLabel(r.statut)+'</span>'+
        '<span class="badge bilan">'+esc(BILAN_LABEL[r.bilan]||r.bilan)+'</span>'+
        '<span>'+fmtDate(r.created_at)+'</span></div>';
      b.onclick=function(){ openDemande(r); };
      lst.appendChild(b);
    });
  }
  function statutLabel(s){return s==='en_attente'?'À relire':s==='valide'?'Validé':s==='envoye'?'Envoyé':s;}

  /* ---- DETAIL ---- */
  function openDemande(r){
    current=r; renderList();
    var repHtml=r.rapport_final||r.rapport_auto||'<p>(aucun rapport généré)</p>';
    var p=$('#panel');
    p.innerHTML=''+
      '<div class="phead">'+
        '<div class="meta"><span class="em">'+esc(r.email)+'</span>'+
          '<div class="d">'+esc(BILAN_LABEL[r.bilan]||r.bilan)+' · reçu le '+fmtDate(r.created_at)+(r.sent_at?' · envoyé le '+fmtDate(r.sent_at):'')+'</div></div>'+
        '<span class="badge '+esc(r.statut)+'">'+statutLabel(r.statut)+'</span>'+
      '</div>'+
      '<div class="pbody">'+
        '<details class="rep"><summary>Voir les réponses du questionnaire</summary><div class="rc" id="repc"></div></details>'+
        '<p class="sec-t">Rapport — relisez et corrigez librement</p>'+
        '<p class="edit-note">Cliquez dans le texte pour le modifier. « Valider &amp; envoyer » enverra ce rapport par e-mail à '+esc(r.email)+'.</p>'+
        '<div class="editor"><div class="rapedit" id="rapedit" contenteditable="true">'+repHtml+'</div></div>'+
        '<div class="actions">'+
          '<button class="btn ghost" id="save-draft">Enregistrer le brouillon</button>'+
          '<span class="sp"></span>'+
          '<span class="savemsg" id="savemsg"></span>'+
          '<button class="btn" id="validate"'+(r.statut==='envoye'?' disabled':'')+'>'+(r.statut==='envoye'?'Déjà envoyé':'Valider &amp; envoyer')+'</button>'+
        '</div>'+
      '</div>';
    renderReponses($('#repc'), r.reponses);
    $('#save-draft').onclick=function(){ saveDraft(r); };
    $('#validate').onclick=function(){ validate(r); };
  }
  function renderReponses(box, rep){
    if(!rep||typeof rep!=='object'){ box.textContent='(pas de réponses enregistrées)'; return; }
    var keys=Object.keys(rep); if(!keys.length){ box.textContent='(pas de réponses enregistrées)'; return; }
    box.innerHTML='';
    keys.forEach(function(k){
      var v=rep[k]; if(Array.isArray(v)) v=v.join(', '); else if(v&&typeof v==='object') v=JSON.stringify(v);
      var d=document.createElement('div'); d.className='repline';
      d.innerHTML='<span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span>';
      box.appendChild(d);
    });
  }

  function patch(r, body, okmsg, btn){
    var msg=$('#savemsg'); msg.className='savemsg'; msg.textContent='';
    var orig=btn?btn.innerHTML:''; if(btn){btn.disabled=true; btn.innerHTML='<span class="spin"></span>';}
    return fetch(SB_URL+'/rest/v1/demandes?id=eq.'+encodeURIComponent(r.id),{method:'PATCH',headers:(function(){var h=hdr(true);h['Prefer']='return=minimal';return h;})(),body:JSON.stringify(body)})
      .then(function(resp){ if(!resp.ok) throw new Error(resp.status); msg.className='savemsg'; msg.textContent=okmsg; if(btn){btn.disabled=false;btn.innerHTML=orig;} load(); })
      .catch(function(){ msg.className='savemsg err'; msg.textContent='Échec de l\'enregistrement.'; if(btn){btn.disabled=false;btn.innerHTML=orig;} });
  }
  function saveDraft(r){
    var html=$('#rapedit').innerHTML;
    patch(r,{rapport_final:html},'Brouillon enregistré.',$('#save-draft'));
  }
  function validate(r){
    if(!confirm('Valider ce bilan et l\'envoyer par e-mail à '+r.email+' ?')) return;
    var html=$('#rapedit').innerHTML;
    patch(r,{rapport_final:html,statut:'valide'},'Validé — e-mail en cours d\'envoi.',$('#validate'));
  }

  /* resume session */
  try{ var t=sessionStorage.getItem('lmn_bo_tok'); if(t){ token=t; enterApp(sessionStorage.getItem('lmn_bo_mail')||''); } }catch(e){}
})();
</script>
</body>
</html>
