<!--ENH-START-->
<style>
#lmn-save-badge{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:.8rem;line-height:1.3;color:var(--fg2,#C6D2DD);opacity:.92}
#lmn-save-badge svg{color:#8fd0a9;flex:none}
#miss[data-lmn="1"]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.q.lmn-flash{animation:lmnflash 1.6s ease}
@keyframes lmnflash{0%,100%{box-shadow:0 0 0 0 rgba(233,176,78,0)}12%,55%{box-shadow:0 0 0 2px #E9B04E,0 0 0 7px rgba(233,176,78,.22)}}
@media (prefers-reduced-motion:reduce){.q.lmn-flash{animation:none;box-shadow:0 0 0 2px #E9B04E}}
</style>
<script>
(function(){
  function id(x){return document.getElementById(x);}
  /* Badge réassurance : réponses sauvegardées localement */
  function badge(){
    if(id('lmn-save-badge')) return;
    var top=id('topin'); if(!top) return;
    var b=document.createElement('div'); b.id='lmn-save-badge';
    b.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg><span>Vos réponses sont enregistrées sur cet appareil — vous pouvez fermer et revenir.</span>';
    top.appendChild(b);
  }
  /* Auto-avance : question à choix unique, uniquement si la page est complète */
  function wireAuto(){
    var pg=id('page'); if(!pg||pg.getAttribute('data-lmn-auto')) return;
    pg.setAttribute('data-lmn-auto','1');
    pg.addEventListener('change',function(ev){
      var t=ev.target; if(!t||t.type!=='radio') return;
      if(t.closest('.scale')||t.closest('.s10')) return;      /* pas sur les échelles */
      var nx=id('next');
      if(nx && !nx.hidden && !nx.disabled){
        setTimeout(function(){ var n=id('next'); if(n && !n.hidden && !n.disabled) n.click(); },300);
      }
    });
  }
  /* 1re question visible sans réponse (les cartes répondues portent .rap-done) */
  function firstMissing(){
    var qs=document.querySelectorAll('#page .q');
    for(var i=0;i<qs.length;i++){ var q=qs[i];
      if(q.offsetParent===null) continue;
      if(q.classList.contains('warn')||q.classList.contains('note')||q.classList.contains('sub')) continue;
      if(!q.querySelector('.opts,.scale,.s10,input,textarea,select')) continue;
      if(!q.classList.contains('rap-done')) return q;
    }
    return null;
  }
  function wireMiss(){
    var m=id('miss'); if(!m||m.getAttribute('data-lmn')) return;
    m.setAttribute('data-lmn','1'); m.title='Aller à la première question sans réponse';
    m.addEventListener('click',function(){
      var q=firstMissing(); if(!q) return;
      try{ q.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){ try{q.scrollIntoView();}catch(_){} }
      q.classList.remove('lmn-flash'); void q.offsetWidth; q.classList.add('lmn-flash');
      setTimeout(function(){ q.classList.remove('lmn-flash'); },1700);
    });
  }
  function tick(){ try{badge();wireAuto();wireMiss();}catch(e){} }
  if(window.MutationObserver){ new MutationObserver(tick).observe(document.body,{childList:true,subtree:true}); }
  tick(); setTimeout(tick,300); setInterval(tick,1200);
})();
</script>
<!--ENH-END-->
