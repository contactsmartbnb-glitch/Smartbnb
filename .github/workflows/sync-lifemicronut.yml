name: Sync to lifemicronut/lifemicronut

# Déclenchement : push sur la branche de travail OU sur main,
# uniquement quand le dossier lifemicronut/ a été modifié.
# Possibilité de déclenchement manuel via workflow_dispatch.
on:
  push:
    branches:
      - main
      - claude/eloquent-edison-KXY7o
    paths:
      - 'lifemicronut/**'
      - '.github/workflows/sync-lifemicronut.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (Smartbnb)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone target repo (lifemicronut/lifemicronut)
        env:
          DEPLOY_TOKEN: ${{ secrets.LIFEMICRONUT_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Secret LIFEMICRONUT_DEPLOY_TOKEN manquant dans le repo Smartbnb."
            echo "Va sur https://github.com/contactsmartbnb-glitch/Smartbnb/settings/secrets/actions/new"
            echo "et ajoute un secret nommé LIFEMICRONUT_DEPLOY_TOKEN avec ton Fine-grained PAT."
            exit 1
          fi
          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/lifemicronut/lifemicronut.git" target-repo

      - name: Sync files (excluding .git and old zip)
        run: |
          # rsync : copie en miroir + supprime ce qui n'existe plus côté source.
          # On exclut .git (sinon on écrase le .git du target) et le vieux zip
          # historique pour qu'il soit nettoyé une bonne fois pour toutes.
          rsync -av --delete \
            --exclude='.git' \
            --exclude='lifemicronut.zip' \
            lifemicronut/ target-repo/

      - name: Commit and push to target
        run: |
          cd target-repo
          git config user.name "LifeMicroNut Deploy Bot"
          git config user.email "lifemicronut@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Aucun changement à propager — déjà à jour."
          else
            COMMIT_SHA="${GITHUB_SHA:0:7}"
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            # Fallback si workflow_dispatch (pas de head_commit.message)
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="Manual sync from Smartbnb @ ${COMMIT_SHA}"
            fi
            git commit -m "${COMMIT_MSG}

Auto-sync depuis contactsmartbnb-glitch/Smartbnb @ ${COMMIT_SHA}"
            git push
            echo "::notice::Site déployé — Cloudflare Pages va redéployer en ~30 secondes."
          fi
